<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab chat — LLM Guardrails Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #12161c;
      --card: #1b222c;
      --line: #313b4a;
      --text: #e7edf5;
      --muted: #a8b3c2;
      --accent: #8ee0d4;
      --warn: #f0c27a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main { max-width: 42rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.4rem; }
    p { color: var(--muted); }
    .row { display: flex; gap: 0.75rem; align-items: center; margin: 1rem 0; }
    label { font-weight: 600; }
    select, textarea, button {
      font: inherit;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    textarea { width: 100%; min-height: 7rem; padding: 0.75rem; }
    button {
      background: var(--accent);
      color: #10211f;
      border: 0;
      padding: 0.6rem 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .answer {
      margin-top: 1rem;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      white-space: pre-wrap;
    }
    .meta { color: var(--warn); font-size: 0.92rem; }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Lab chat</h1>
    <p>
      This page talks only to the API on this machine. Your model key stays on the server.
      “Before rails” calls <code>/v1/chat/raw</code>. “After rails” calls <code>/v1/chat/guarded</code>.
    </p>
    <div class="row">
      <label for="mode">Mode</label>
      <select id="mode">
        <option value="raw">Before rails</option>
        <option value="guarded" selected>After rails</option>
      </select>
    </div>
    <label for="message">Message</label>
    <textarea id="message" placeholder="Ask what this lab does."></textarea>
    <div class="row">
      <button id="send" type="button">Send</button>
    </div>
    <p id="status" class="meta" role="status"></p>
    <div id="answer" class="answer" hidden></div>
  </main>
  <script>
    const message = document.getElementById("message");
    const mode = document.getElementById("mode");
    const status = document.getElementById("status");
    const answer = document.getElementById("answer");

    document.getElementById("send").addEventListener("click", send);
    message.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) send();
    });

    async function send() {
      const text = message.value.trim();
      if (!text) {
        status.textContent = "Write a message first.";
        return;
      }
      status.textContent = "Waiting for the model…";
      answer.hidden = true;
      const path = mode.value === "guarded" ? "/v1/chat/guarded" : "/v1/chat/raw";
      try {
        const response = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        const payload = await response.json();
        if (!response.ok) {
          status.textContent = payload.detail || "The request failed.";
          return;
        }
        answer.hidden = false;
        answer.textContent = payload.reply;
        status.textContent = payload.guardrails === "on"
          ? (payload.blocked ? "Guardrails on. A rail stopped this turn." : "Guardrails on. The reply was allowed.")
          : "Guardrails off. This is the before path.";
      } catch (error) {
        status.textContent = "Could not reach the API.";
      }
    }
  </script>
</body>
</html>
